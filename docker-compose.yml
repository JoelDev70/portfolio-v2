version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: joel_db
    environment:
      POSTGRES_USER: joel_admin
      POSTGRES_PASSWORD: super_mot_de_passe_securise
      POSTGRES_DB: joel_portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    image: node:22-alpine
    container_name: joel_app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

    environment:
      - DATABASE_URL=postgresql://joel_admin:super_mot_de_passe_securise@db:5432/joel_portfolio_db?schema=public
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db  

volumes:
  postgres_data: